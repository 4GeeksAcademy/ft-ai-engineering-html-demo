<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100">
    <main
      class="mx-auto flex min-h-screen w-full max-w-3xl items-center px-4 py-10"
    >
      <section
        class="w-full overflow-hidden rounded-2xl bg-white shadow-xl ring-1 ring-slate-200"
      >
        <div class="bg-slate-900 px-6 py-8 text-white sm:px-8">
          <h1 class="text-2xl font-semibold">Secure Checkout</h1>
          <p class="mt-2 text-sm text-slate-200">
            Complete your payment details below.
          </p>
        </div>

        <form
          action="https://httpbin.org/post"
          method="post"
          class="space-y-6 px-6 py-8 sm:px-8"
        >
          <div class="grid gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label
                for="full-name"
                class="mb-2 block text-sm font-medium text-slate-700"
                >Full name</label
              >
              <input
                id="full-name"
                name="full-name"
                type="text"
                autocomplete="name"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                placeholder="Alex Smith"
              />
            </div>

            <div class="sm:col-span-2">
              <label
                for="email"
                class="mb-2 block text-sm font-medium text-slate-700"
                >Email address</label
              >
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                placeholder="alex@example.com"
              />
            </div>

            <div class="sm:col-span-2">
              <label
                for="card-number"
                class="mb-2 block text-sm font-medium text-slate-700"
                >Card number</label
              >
              <input
                id="card-number"
                name="card-number"
                type="text"
                inputmode="numeric"
                autocomplete="cc-number"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                placeholder="1234 5678 9012 3456"
              />
            </div>

            <div>
              <label
                for="expiry"
                class="mb-2 block text-sm font-medium text-slate-700"
                >Expiry date</label
              >
              <input
                id="expiry"
                name="expiry"
                type="text"
                inputmode="numeric"
                autocomplete="cc-exp"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                placeholder="MM/YY"
              />
            </div>

            <div>
              <label
                for="cvv"
                class="mb-2 block text-sm font-medium text-slate-700"
                >CVV</label
              >
              <input
                id="cvv"
                name="cvv"
                type="password"
                inputmode="numeric"
                autocomplete="cc-csc"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                placeholder="123"
              />
            </div>

            <div>
              <label
                for="country"
                class="mb-2 block text-sm font-medium text-slate-700"
                >Country</label
              >
              <select
                id="country"
                name="country"
                required
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
              >
                <option value="">Select country</option>
                <option value="us">United States</option>
                <option value="ca">Canada</option>
                <option value="mx">Mexico</option>
                <option value="uk">United Kingdom</option>
              </select>
            </div>

            <div>
              <label
                for="postal-code"
                class="mb-2 block text-sm font-medium text-slate-700"
                >Postal code</label
              >
              <input
                id="postal-code"
                name="postal-code"
                type="text"
                autocomplete="postal-code"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                placeholder="10001"
              />
            </div>

            <div class="sm:col-span-2">
              <label
                for="amount"
                class="mb-2 block text-sm font-medium text-slate-700"
                >Payment amount (USD)</label
              >
              <input
                id="amount"
                name="amount"
                type="number"
                min="1"
                step="0.01"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
                placeholder="49.99"
              />
            </div>
          </div>

          <label
            class="flex items-start gap-3 rounded-lg border border-slate-200 p-3 text-sm text-slate-700"
          >
            <input
              type="checkbox"
              name="save-card"
              class="mt-0.5 h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-400"
            />
            Save this card for future purchases
          </label>

          <button
            type="submit"
            class="w-full rounded-lg bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
          >
            Pay Now
          </button>

          <p class="text-center text-xs text-slate-500">
            Your payment is encrypted and securely processed.
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
